name: Daily CCNA Schedule Tracker

on:
  schedule:
    # Run at 12:00 PM UTC (8:00 AM EST) every day
    - cron: '0 12 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync_and_adjust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread

      - name: Create Credentials JSON from Secret
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

      - name: Download Current Schedule
        run: python scripts/download_from_sheets.py

      - name: Generate Adjusted Schedule
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/generate_schedule.py

      - name: Upload New Schedule
        run: python scripts/upload_to_sheets.py
